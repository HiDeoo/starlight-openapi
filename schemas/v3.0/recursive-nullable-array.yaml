openapi: 3.1.0
info:
  title: Recursive Nullable Array
  description: Reproduces cycle-detection failure with OpenAPI 3.1 nullable array type notation.
  version: 1.0.0
servers:
  - url: 'http://localhost'
paths:
  /validate:
    post:
      summary: Validate
      operationId: validate
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
components:
  schemas:
    ValidationError:
      type: object
      properties:
        message:
          type: string
        causes:
          type: ['array', 'null']
          items:
            $ref: '#/components/schemas/ValidationError'
